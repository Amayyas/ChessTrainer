<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1A2E" />

    <title>ChessTrainer AI — Apprenez les échecs avec un coach intelligent</title>
    <meta
      name="description"
      content="Un coach d'échecs qui analyse vos parties avec Stockfish, des puzzles tactiques et un mode arcade. Gratuit, sans compte obligatoire."
    />

    <!--
      Social preview. __SITE_URL__ is filled in at build time from VITE_SITE_URL;
      with no domain set it collapses to a relative path, which most scrapers
      still resolve. The image is a placeholder until the brand identity lands.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChessTrainer AI" />
    <meta property="og:title" content="ChessTrainer AI" />
    <meta
      property="og:description"
      content="Un coach d'échecs qui analyse vos parties avec Stockfish, des puzzles tactiques et un mode arcade."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChessTrainer AI" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
