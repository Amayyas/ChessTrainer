# Netlify deployment.
#
# Node comes from .nvmrc, which Netlify reads, so the build runs on the same
# major as CI and as local development. Keep the version in that one file.

[build]
  command = "npm run build"
  publish = "dist"
  # One release, one production deploy. Every merge to main used to publish,
  # at 15 credits each, so a fix, a docs change and the release PR that
  # followed them cost three deploys for one visible change. Production now
  # builds only when the merge changed .release-please-manifest.json, which
  # release-please alone touches, on its release PR. Other merges to main are
  # cancelled here and ride along with the next release.
  #
  # Netlify reads exit 0 as "cancel" and 1 as "build". Branches other than main
  # (deploy previews, which are free) always build. Anything git cannot answer
  # — a clone too shallow to have HEAD^ exits 128 — is mapped to 1, so a doubt
  # publishes rather than silently skips.
  #
  # To publish outside a release, use a build hook: Netlify documents that the
  # ignore command never cancels a build a hook triggered.
  ignore = '[ "$BRANCH" != "main" ] && exit 1; git diff --quiet HEAD^ HEAD -- .release-please-manifest.json && exit 0; exit 1'

# One address for one app. The netlify.app name kept serving the whole site
# after the domain went live, which is worse than untidy: localStorage is scoped
# per origin, so anyone who bookmarked it during setup keeps a second, silently
# divergent guest progression — and search engines see the same pages twice.
#
# Before the rewrite below, which matches any host and would otherwise swallow
# this.
[[redirects]]
  from = "https://chesstrainer-ai.netlify.app/*"
  to = "https://chesstrainer.fr/:splat"
  status = 301
  force = true

# Client-side routing. Without this, a direct hit on /coach — a shared link, a
# bookmark, a page reload — asks the CDN for a file that does not exist and
# gets a 404, so the app never starts. Navigating from the home page hides the
# problem entirely, since React does the routing there.
#
# Falls back to app.html, not index.html: the build (scripts/prerender.mjs)
# bakes server-rendered markup for '/' into index.html so its first paint does
# not wait on the JS bundle, and app.html is the empty shell taken before that
# happens. Every route but '/' hydrates onto an empty #root the way the whole
# app always has; splicing the landing's markup into every address instead
# would hand each of them a server render that does not match what mounts
# there, which is a hydration mismatch, not a faster paint.
#
# Real files still win: Netlify serves an existing asset before applying a
# rewrite, so /stockfish/stockfish.js, /og-image.png and index.html itself for
# a direct hit on '/' are unaffected.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Vite fingerprints these filenames, so the name changes whenever the content
# does and a stale copy can never be served.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The engine is not fingerprinted — the filename is fixed — so it is cached for
# a day and revalidated, rather than pinned in browsers for a year. The wasm is
# ~7 MB (Stockfish 18's NNUE net), so the day of free reuse matters; a deploy
# that revs the engine costs returning visitors one 24 h-stale load at worst.
[[headers]]
  for = "/stockfish/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# No cross-origin isolation here on purpose. COOP/COEP would be needed for the
# threaded Stockfish build, which wants SharedArrayBuffer; this app ships the
# single-threaded one, and those headers would constrain every asset the page
# loads for no gain.
#
# The Content-Security-Policy ships in Report-Only first. The Supabase session
# lives in localStorage (persistSession), so an XSS would be an account
# takeover, and a CSP is the defence-in-depth that makes an injection
# unexploitable — but it can only be enforced once a real deploy confirms
# nothing legitimate trips it.
#
# There is no `report-to` endpoint: Netlify offers no report sink and this file
# cannot interpolate the Sentry DSN (which lives in an env var). Verification is
# manual — open the deployed site, exercise every mode, and read the browser
# console for `Report Only` violations. Enough traffic to matter goes through
# the author's own browser at this stage. Wire Sentry's security endpoint as a
# real sink before enforcing if that stops being true. Enforce (rename the key
# to `Content-Security-Policy`) once a pass comes back clean.
#
# What each source has to cover:
#   script-src  'wasm-unsafe-eval' — Stockfish compiles a .wasm module in the
#               worker; without it the engine fails to start under enforcement.
#               Vite's inline module-preload polyfill also needs a hash or
#               `modulePreload.polyfill = false` before this can go enforcing.
#   worker-src  the engine is `new Worker('/stockfish/stockfish.js')`, same
#               origin; `blob:` covers builds that wrap the worker.
#   style-src   'unsafe-inline' — framer-motion and the board write inline
#               style attributes; a nonce cannot reach them.
#   connect-src Supabase REST + Auth (https) and Realtime (wss), and Sentry's
#               EU ingest host. HSTS is added by Netlify when Force HTTPS is on.
#
# Cache-Control here is the fallback for everything the two rules above do not
# claim — the HTML documents most of all. They must be revalidated on every
# load so a client that kept an old index.html cannot go on requesting route
# chunks whose fingerprints changed in a deploy. The fingerprinted assets keep
# their year-long immutable cache from the more specific rule.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.de.sentry.io"
