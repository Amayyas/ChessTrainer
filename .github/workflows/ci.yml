name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A PR pushed several times in a row only runs the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the baseline the project requires, 24 the next LTS it has to
        # keep working on. 18 and 20 are both past end of life.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

  # Branch protection requires status checks by name, and a matrix job's name
  # carries the version — so bumping Node renames the checks and leaves the rule
  # waiting for names that will never report again. That is what blocked this
  # very pull request. This job's name does not move, so it is the one to
  # require, and the matrix underneath is free to change.
  quality-matrix:
    name: Quality
    runs-on: ubuntu-latest
    needs: quality
    # Without this, a failing matrix skips this job instead of failing it, and a
    # skipped required check blocks the merge for the wrong reason.
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "Quality matrix: ${{ needs.quality.result }}"
          [ "${{ needs.quality.result }}" = "success" ]

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build & bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Performance & accessibility audit
        run: npx lhci autorun

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/report/
          retention-days: 7
