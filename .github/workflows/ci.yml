name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A PR pushed several times in a row only runs the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job installs with this npm, whatever npm its Node ships.
#
# Node 22 bundles npm 10 and Node 24 bundles npm 11, and the two disagree about
# whether an optional peer dependency has to be listed in the lockfile —
# puppeteer-core's proxy-agent tree is the one that bites. npm 11 resolves the
# same 684 packages without those entries and writes a lockfile without them;
# npm 10 reads that lockfile and fails `npm ci` with EUSAGE, naming them as
# missing. So a lockfile generated by Dependabot, or on a developer's machine,
# passed the Node 24 leg and failed every Node 22 one. Nothing was wrong with
# the dependencies: the two installers simply disagreed, and the pipeline ran
# both without saying so.
#
# Pinned to a major rather than an exact version, so patch releases arrive
# without a commit, and raised deliberately when the baseline Node moves.
env:
  NPM_VERSION: '11'

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the baseline the project requires, 24 the next LTS it has to
        # keep working on. 18 and 20 are both past end of life.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

  # Branch protection requires status checks by name, and a matrix job's name
  # carries the version — so bumping Node renames the checks and leaves the rule
  # waiting for names that will never report again. That is what blocked this
  # very pull request. This job's name does not move, so it is the one to
  # require, and the matrix underneath is free to change.
  quality-matrix:
    name: Quality
    runs-on: ubuntu-latest
    needs: quality
    # Without this, a failing matrix skips this job instead of failing it, and a
    # skipped required check blocks the merge for the wrong reason.
    if: always()
    steps:
      - name: Report the matrix result
        run: |
          echo "Quality matrix: ${{ needs.quality.result }}"
          [ "${{ needs.quality.result }}" = "success" ]

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Vitest
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  policies:
    name: Database policies
    runs-on: ubuntu-latest

    # The policies are the only security in this project that nothing else
    # covers, so they are tested against a real Postgres rather than read.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chesstrainer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      # The bootstrap supplies the little of Supabase the migrations lean on —
      # auth.uid(), auth.users, the two roles. Everything after it is the real
      # migrations, in the order a fresh project would apply them: the tests
      # have to run against what a deployment gets, not a copy of it.
      - name: Apply schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -d chesstrainer -v ON_ERROR_STOP=1 \
            -q -f supabase/tests/bootstrap.sql
          for file in supabase/migrations/*.sql; do
            echo "applying $(basename "$file")"
            psql -h localhost -U postgres -d chesstrainer -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Policy tests
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/chesstrainer
        run: npm run test:rls

  build:
    name: Build & bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      # Built as production is built, or the budget guards the wrong thing. With
      # no DSN the guard in monitoring.ts is statically false, the dynamic
      # import is dropped as dead code, and the Sentry chunk this measures never
      # exists — some 27 kB that ships to every player and that CI never saw.
      #
      # The value is deliberately not a real DSN: nothing here runs the app, so
      # only its presence matters, and a working one would invite CI failures
      # into the project's issue list.
      - name: Production build
        env:
          VITE_SENTRY_DSN: https://ci@o0.ingest.de.sentry.io/0
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm i -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Performance & accessibility audit
        run: npx lhci autorun

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/report/
          retention-days: 7
