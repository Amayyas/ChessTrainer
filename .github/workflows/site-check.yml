# Checks the deployed frontend, the way keepalive.yml checks the backend.
#
# A Netlify deploy can succeed and still ship a broken SPA rewrite, a sitemap
# that 404s, or drop the security headers. Nothing surfaced that — a visitor
# would find it first.
#
# Run by hand after a deploy — which means after merging a release PR, since
# production builds on nothing else (see CLAUDE.md, "Deploy budget"). The
# schedule stays commented until a run by hand comes back green against
# production: until then a scheduled run is red every six hours for a known
# reason, and a check that is always red stops being read.
name: Site check

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: Base URL to check
        default: https://chesstrainer.fr
  # schedule:
  #   - cron: '43 */6 * * *'

permissions:
  contents: read

jobs:
  check:
    name: Check the deployed site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: check-deployed
        run: node scripts/check-deployed.mjs "${{ inputs.base-url || 'https://chesstrainer.fr' }}"
