# Checks the deployed frontend, the way keepalive.yml checks the backend.
#
# A Netlify deploy can succeed and still ship a broken SPA rewrite, a sitemap
# that 404s, or drop the security headers. Nothing surfaced that — a visitor
# would find it first.
#
# Runs every six hours, and by hand after a deploy — which means after merging
# a release PR, since production builds on nothing else (see CLAUDE.md,
# "Deploy budget"). The schedule catches what no deploy causes: a setting
# changed in the Netlify UI, a certificate, the domain.
#
# Each run makes 17 requests and downloads about 210 KB, most of it the bundle
# the cache check fetches — roughly 0.9 Netlify credits a month at this rate.
# That is 0.7 measured when the schedule was turned on, plus the eight requests
# of the sitemap-page check (the sitemap and a 2 KB shell per page), priced at
# 2 credits per 10,000 requests.
name: Site check

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: Base URL to check
        default: https://chesstrainer.fr
  schedule:
    - cron: '43 */6 * * *'

permissions:
  contents: read

jobs:
  check:
    name: Check the deployed site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: check-deployed
        run: node scripts/check-deployed.mjs "${{ inputs.base-url || 'https://chesstrainer.fr' }}"
